[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coherra"
version = "0.1.0"
description = "Structured memory auditor and repair engine for Sibyl Memory — MCP server + CLI."
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0,<2",
    "sibyl-memory-client>=0.5.0",
    "httpx>=0.24.0",
    "starlette>=0.30.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
]
onboard = [
    "google-generativeai>=0.4.0",
]

[project.scripts]
# CLI entry point:  coherra health / scan / issues / fix / onboard / serve
coherra     = "coherra.cli:main"
# MCP server entry point (for .mcp.json / Claude Code config)
coherra-mcp = "coherra.__main__:main"
# HTTP server entry point (x402 payment gate)
coherra-serve = "coherra.http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["coherra"]
